<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Attendance</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/register.css">
</head>
<body>
    <div class="bg-layer"><div class="blob blob-1"></div><div class="blob blob-2"></div></div>
    <div class="grid-overlay"></div>
    <div class="toast-container" id="toastContainer"></div>
    <main class="register-container">
        <div class="register-card">
            <div class="brand">
                <div class="brand-icon"><i class="fas fa-user-plus"></i></div>
                <h1>Create Account</h1>
                <p>Sign up for a new account</p>
            </div>
            <form id="registerForm" novalidate>
                <div class="role-group">
                    <label class="role-option">
                        <input type="radio" name="role" value="teacher">
                        <div class="role-box">
                            <i class="fas fa-chalkboard-teacher"></i>
                            <span>Teacher</span>
                        </div>
                    </label>
                    <label class="role-option">
                        <input type="radio" name="role" value="student" checked>
                        <div class="role-box">
                            <i class="fas fa-user-graduate"></i>
                            <span>Student</span>
                        </div>
                    </label>
                </div>
                <div class="input-group">
                    <label for="regName">Full Name</label>
                    <div class="input-wrap"><i class="fas fa-user field-icon"></i><input type="text" id="regName" placeholder="Your full name" required></div>
                    <div class="error-msg" id="nameErr"><i class="fas fa-exclamation-circle"></i><span></span></div>
                </div>
                <div class="input-group">
                    <label for="regEmail">Email</label>
                    <div class="input-wrap"><i class="fas fa-envelope field-icon"></i><input type="email" id="regEmail" placeholder="username@school.edu" required></div>
                    <div class="error-msg" id="emailErr"><i class="fas fa-exclamation-circle"></i><span></span></div>
                </div>
                <div class="input-group">
                    <label for="regPw">Password</label>
                    <div class="input-wrap"><i class="fas fa-lock field-icon"></i><input type="password" id="regPw" placeholder="At least 6 characters" required><button type="button" class="toggle-pw" aria-label="Toggle password"><i class="fas fa-eye"></i></button></div>
                    <div class="error-msg" id="pwErr"><i class="fas fa-exclamation-circle"></i><span></span></div>
                </div>
                <div class="input-group">
                    <label for="regPwConfirm">Confirm Password</label>
                    <div class="input-wrap"><i class="fas fa-shield-halved field-icon"></i><input type="password" id="regPwConfirm" placeholder="Re-enter password" required><button type="button" class="toggle-pw" aria-label="Toggle password"><i class="fas fa-eye"></i></button></div>
                    <div class="error-msg" id="pw2Err"><i class="fas fa-exclamation-circle"></i><span></span></div>
                </div>
                <button type="submit" class="submit-btn" id="submitBtn">
                    <span class="btn-text">Create Account</span>
                    <div class="spinner"></div>
                </button>
            </form>
            <div class="back-link"><a href="/"><i class="fas fa-arrow-left"></i> Back to Login</a></div>
        </div>
    </main>
    <script src="/static/js/register.js"></script>
</body>
</html>
