<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance - Log In</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="bg-layer"><div class="blob blob-1"></div><div class="blob blob-2"></div></div>
    <div class="grid-overlay"></div>
    <div class="toast-container" id="toastContainer"></div>
    <main class="login-container">
        <div class="login-card">
            <div class="brand">
                <div class="brand-icon"><i class="fas fa-clipboard-check"></i></div>
                <h1>Attendance</h1>
                <p>Sign in to check attendance</p>
            </div>
            <form id="loginForm" novalidate>
                <div class="role-group">
                    <label class="role-option">
                        <input type="radio" name="role" value="teacher" checked>
                        <div class="role-box">
                            <i class="fas fa-chalkboard-teacher"></i>
                            <span>Teacher</span>
                        </div>
                    </label>
                    <label class="role-option">
                        <input type="radio" name="role" value="student">
                        <div class="role-box">
                            <i class="fas fa-user-graduate"></i>
                            <span>Student</span>
                        </div>
                    </label>
                </div>
                <div class="input-group">
                    <label for="email">Email</label>
                    <div class="input-wrap">
                        <i class="fas fa-envelope field-icon"></i>
                        <input type="email" id="email" placeholder="username@school.edu" required>
                    </div>
                    <div class="error-msg" id="emailErr"><i class="fas fa-exclamation-circle"></i><span></span></div>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <i class="fas fa-lock field-icon"></i>
                        <input type="password" id="password" placeholder="Your password" required>
                        <button type="button" class="toggle-pw" aria-label="Toggle password"><i class="fas fa-eye"></i></button>
                    </div>
                    <div class="error-msg" id="pwErr"><i class="fas fa-exclamation-circle"></i><span></span></div>
                </div>
                <button type="submit" class="submit-btn" id="submitBtn">
                    <span class="btn-text">Log In</span>
                    <div class="spinner"></div>
                </button>
            </form>
            <div class="register-link">
                <span>Don't have an account?</span>
                <a href="/register">Register here</a>
            </div>
        </div>
    </main>
    <script src="/static/js/script.js"></script>
</body>
</html>
