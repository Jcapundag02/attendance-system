<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/student.css">
</head>
<body>
    <div class="toast-container" id="toastContainer"></div>
    <header class="topbar">
        <div class="topbar-left"><i class="fas fa-user-graduate"></i><span>Student Dashboard</span></div>
        <div class="topbar-right">
            <span class="user-name" id="userName">-</span>
            <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Log Out</button>
        </div>
    </header>
    <main class="dashboard">
        <div class="welcome-card">
            <h2 id="welcomeMsg">Welcome!</h2>
            <p>View your attendance records below.</p>
        </div>
        <div class="stats-row">
            <div class="stat-card"><div class="stat-num" id="statTotal">0</div><div class="stat-label">Total Days</div></div>
            <div class="stat-card present"><div class="stat-num" id="statPresent">0</div><div class="stat-label">Present</div></div>
            <div class="stat-card absent"><div class="stat-num" id="statAbsent">0</div><div class="stat-label">Absent</div></div>
            <div class="stat-card late"><div class="stat-num" id="statLate">0</div><div class="stat-label">Late</div></div>
        </div>
        <div class="percent-card">
            <div class="percent-circle" id="percentCircle"><span id="percentText">0%</span></div>
            <div class="percent-info">
                <h3>Attendance Rate</h3>
                <p id="percentDesc">-</p>
            </div>
        </div>
        <div class="table-card">
            <h2><i class="fas fa-calendar-check"></i> Records</h2>
            <table>
                <thead><tr><th>Date</th><th>Status</th></tr></thead>
                <tbody id="recordsBody"></tbody>
            </table>
        </div>
    </main>
    <script src="/static/js/student.js"></script>
</body>
</html>
